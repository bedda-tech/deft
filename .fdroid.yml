### F-Droid build recipe for Deft (tech.bedda.deft)
###
### STATUS: NOT SUBMITTED — see docs/fdroid-submission.md for the blockers that
### must clear before this recipe can be copied into fdroiddata as
### metadata/tech.bedda.deft.yml and a merge request opened.
###
### Keep in sync with app.json (expo.version / expo.android.versionCode) and
### with fastlane/metadata/android/en-US/changelogs/<versionCode>.txt.

Categories:
  - Productivity
  - Accessibility

License: MIT

AuthorName: Bedda Tech
AuthorEmail: hello@bedda.tech
AuthorWebSite: https://github.com/bedda-tech

SourceCode: https://github.com/bedda-tech/deft
IssueTracker: https://github.com/bedda-tech/deft/issues
Changelog: https://github.com/bedda-tech/deft/releases

AutoName: Deft

RepoType: git
Repo: https://github.com/bedda-tech/deft.git

# Deft is an Expo app: the android/ project is NOT committed, it is generated by
# `expo prebuild`. The recipe must npm install and prebuild before gradle runs.
Builds:
  - versionName: 1.4.5
    versionCode: 10
    commit: v1.4.5
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends nodejs npm
    # Both steps live in `init` (base dir), not `prebuild`: prebuild runs inside
    # `subdir`, and android/ does not exist until expo prebuild creates it.
    init:
      - npm ci
      - npx expo prebuild --platform android --no-install
    gradle:
      - release
    # BLOCKED: `npm ci` cannot resolve the three `file:../` sibling deps in a
    # single-repo F-Droid checkout. Do not remove this until they are on npm.
    disable: sibling deps use file:../ paths, not published to npm

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.4.5
CurrentVersionCode: 10

# Gemma 4 weights are downloaded from HuggingFace on first run and are covered by
# the Gemma Terms of Use, not an OSI-approved licence. The optional cloud fallback
# talks to OpenAI / Anthropic / OpenRouter when the user supplies an API key.
AntiFeatures:
  - NonFreeAssets
  - NonFreeNet
